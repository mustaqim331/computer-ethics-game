<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tech Ethics: Decision Courtroom</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
    --bg-color: #0d0e15;
    --card-bg: #181a24;
    --accent-color: #5ce1e6;
    --text-color: #f8fafc;
    --text-muted: #8a8fbf;
    --success: #4ade80;
    --danger: #f87171;
    --warning: #facc15;
    --border-color: #3b3e5b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Press Start 2P', monospace;
    -webkit-tap-highlight-color: transparent;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    min-height: -webkit-fill-available;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 10px;
}

html {
    height: -webkit-fill-available;
}

.game-container {
    background-color: var(--card-bg);

    width: 100%;
    max-width: 850px;

    border-radius: 4px;

    box-shadow:
        0 0 20px rgba(92,225,230,0.2),
        inset 0 0 10px rgba(0,0,0,0.8);

    padding: 20px;

    border: 4px solid var(--border-color);

    position: relative;

    margin: auto;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}


/* =========================
   START SCREEN
========================= */

.start-screen {
    text-align: center;
    padding: 40px 10px;
}

.start-screen h1 {
    color: var(--accent-color);

    font-size: 1.2rem;

    line-height: 1.8;

    margin-bottom: 30px;

    text-shadow: 3px 3px #000;
}

.name-input {
    width: 100%;
    max-width: 500px;

    padding: 15px;

    background: #08090d;

    border: 2px solid var(--border-color);

    color: white;

    font-family: 'Press Start 2P', monospace;

    font-size: 0.65rem;

    margin-bottom: 20px;

    outline: none;
}

.name-input:focus {
    border-color: var(--accent-color);
}


/* =========================
   GAME HEADER
========================= */

.game-header {

    display: flex;

    flex-direction: row;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

    border-bottom: 2px dashed var(--border-color);

    padding-bottom: 10px;

    gap: 10px;
}

.category-badge {

    color: var(--accent-color);

    font-size: 0.6rem;

    line-height: 1.4;

    word-break: break-word;
}

.node-counter {

    font-size: 0.6rem;

    color: var(--warning);

    white-space: nowrap;
}


/* =========================
   ROLE BOX
========================= */

.role-box {

    background: #10121a;

    border: 2px solid var(--accent-color);

    padding: 12px;

    margin-bottom: 15px;

    font-size: 0.55rem;

    line-height: 1.7;
}

.role-title {
    color: var(--warning);
    margin-bottom: 6px;
}


/* =========================
   DIALOGUE
========================= */

.speaker-box {

    color: var(--warning);

    font-size: 0.75rem;

    margin-bottom: 8px;

    text-transform: uppercase;
}

.dialogue-box {

    background-color: #08090d;

    padding: 15px;

    border-radius: 4px;

    margin-bottom: 15px;

    border: 2px solid var(--border-color);

    line-height: 1.7;

    min-height: 100px;

    font-size: 0.7rem;

    color: #fff;

    word-break: break-word;
}


/* =========================
   OPTIONS
========================= */

.options-container {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.btn {

    background-color: #242738;

    color: var(--text-color);

    border: 2px solid var(--border-color);

    padding: 12px;

    font-size: 0.6rem;

    cursor: pointer;

    transition: all 0.1s ease;

    text-align: left;

    line-height: 1.5;

    box-shadow: 3px 3px 0px #000;

    width: 100%;

    word-break: break-word;
}

.btn:hover:not(:disabled),
.btn:active:not(:disabled) {

    background-color: var(--accent-color);

    color: #000;

    border-color: #fff;
}

.btn:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}

.btn-start {

    background-color: var(--accent-color);

    color: #000;

    font-size: 0.8rem;

    padding: 16px 24px;

    text-align: center;

    display: inline-block;

    box-shadow: 4px 4px 0px #000;

    width: auto;

    max-width: 100%;
}

.btn-start:hover,
.btn-start:active {

    background-color: #fff;

    transform: scale(1.02);
}


/* =========================
   OUTCOME
========================= */

.verdict-box {

    text-align: center;

    padding: 20px 10px;

    border: 4px solid var(--border-color);

    margin-bottom: 20px;

    background-color: #08090d;
}

.player-result {

    color: var(--accent-color);

    font-size: 0.55rem;

    margin-bottom: 15px;

    line-height: 1.6;
}

.verdict-badge {

    font-size: 0.9rem;

    margin-bottom: 12px;

    line-height: 1.5;

    text-shadow: 2px 2px #000;

    word-break: break-word;
}

.stats-grid {

    display: grid;

    grid-template-columns: repeat(2,1fr);

    gap: 8px;

    margin: 15px 0;

    text-align: left;

    font-size: 0.55rem;

    background: #12141d;

    padding: 12px;

    border: 1px solid var(--border-color);
}

.stat-item {

    display: flex;

    flex-direction: column;

    gap: 4px;

    padding: 2px 0;
}

.stat-val {

    color: var(--accent-color);
}

.archetype-title {

    color: var(--warning);

    font-size: 0.75rem;

    margin-bottom: 10px;

    line-height: 1.4;

    word-break: break-word;
}

.verdict-description {

    font-size: 0.6rem;

    line-height: 1.7;

    margin-bottom: 15px;

    color: #fff;

    word-break: break-word;
}

.decision-count {

    font-size: 0.5rem;

    color: var(--text-muted);

    margin-top: 10px;
}


/* =========================
   MOBILE
========================= */

@media (max-width:600px) {

    body {
        padding: 5px;
    }

    .game-container {
        padding: 12px;
        border-width: 3px;
    }

    .start-screen {
        padding: 25px 5px;
    }

    .start-screen h1 {
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .speaker-box {
        font-size: 0.7rem;
    }

    .dialogue-box {
        padding: 12px;
        font-size: 0.62rem;
        min-height: 110px;
        line-height: 1.6;
    }

    .btn {
        padding: 10px;
        font-size: 0.55rem;
    }

    .btn-start {
        font-size: 0.7rem;
        padding: 14px 20px;
    }

    .stats-grid {
        grid-template-columns: 1fr;
        gap: 6px;
        font-size: 0.5rem;
    }

    .stat-item {
        flex-direction: row;
        justify-content: space-between;
    }

    .verdict-badge {
        font-size: 0.75rem;
    }

    .archetype-title {
        font-size: 0.65rem;
    }

    .verdict-description {
        font-size: 0.55rem;
    }

    .role-box {
        font-size: 0.5rem;
    }

}

</style>
</head>

<body>


<div class="game-container">


<!-- =========================
     START SCREEN
========================= -->

<div id="start-screen" class="screen active start-screen">

    <h1>
        TECH ETHICS:<br>
        DECISION COURTROOM
    </h1>

    <input
        id="player-name"
        class="name-input"
        type="text"
        maxlength="30"
        placeholder="ENTER YOUR NAME"
    >

    <br>

    <button
        class="btn btn-start"
        onclick="startGame()"
    >
        START GAME
    </button>

</div>


<!-- =========================
     GAME SCREEN
========================= -->

<div id="game-screen" class="screen">

    <div class="game-header">

        <div id="category-badge"
             class="category-badge">
            Category
        </div>

        <div id="node-counter"
             class="node-counter">
            NODE 1 / 12
        </div>

    </div>


    <div class="role-box">

        <div class="role-title">
            YOUR ROLE
        </div>

        <div id="role-description">
            Role
        </div>

    </div>


    <div id="speaker-box"
         class="speaker-box">
        Character
    </div>


    <div id="dialogue-box"
         class="dialogue-box">
    </div>


    <div id="options-container"
         class="options-container">
    </div>

</div>


<!-- =========================
     OUTCOME SCREEN
========================= -->

<div id="outcome-screen" class="screen">

    <div id="verdict-box"
         class="verdict-box">

        <div id="player-result"
             class="player-result">
        </div>

        <div id="verdict-badge"
             class="verdict-badge">
        </div>

        <div id="archetype-title"
             class="archetype-title">
        </div>

        <div id="verdict-description"
             class="verdict-description">
        </div>


        <div class="stats-grid">

            <div class="stat-item">
                <span>ETHICS:</span>
                <span id="score-ethics"
                      class="stat-val">
                </span>
            </div>

            <div class="stat-item">
                <span>HONESTY:</span>
                <span id="score-honesty"
                      class="stat-val">
                </span>
            </div>

            <div class="stat-item">
                <span>RESPONSIBILITY:</span>
                <span id="score-resp"
                      class="stat-val">
                </span>
            </div>

            <div class="stat-item">
                <span>SELF-INTEREST:</span>
                <span id="score-self"
                      class="stat-val">
                </span>
            </div>

        </div>

        <div id="decision-count"
             class="decision-count">
        </div>

    </div>


    <button
        class="btn btn-start"
        style="display:block;margin:0 auto;"
        onclick="startGame()">

        PLAY NEXT SCENARIO

    </button>

</div>


</div>


<script>


/* ============================================================
   GAME STATE
============================================================ */

let currentScenario = null;

let currentNodeKey = "1";

let typingTimer = null;

let nodeHistoryCount = 1;

let playerName = "";


/* ============================================================
   NEW SCORING SYSTEM
============================================================ */

let scores = {

    ethics: 0,

    honesty: 0,

    responsibility: 0,

    selfInterest: 0,

    decisions: 0

};


/* ============================================================
   DYNAMIC STATE
============================================================ */

let state = {};


/* ============================================================
   SCENARIOS
============================================================ */

const scenarios = [

/* ============================================================
   SCENARIO 1
============================================================ */

{
    category: "Codes of Conduct",

    title: "The Unattended Laptop",

    role:
        "You are Leo, a university student working late on a programming assignment. Your goal is to complete your own work while dealing with academic pressure.",

    nodes: {

        "1": {

            speaker: "LEO",

            text:
                "It's almost midnight. My assignment keeps crashing. Alex left his laptop unlocked while he went to get a drink.",

            options: [

                {
                    text: "Look at Alex's screen.",

                    next: "2A",

                    ethics: -2,
                    honesty: -1,
                    resp: -1,
                    self: 1
                },

                {
                    text: "Stay on your own computer.",

                    next: "2B",

                    ethics: 2,
                    honesty: 1,
                    resp: 1,
                    self: 0
                }

            ]

        },


        "2A": {

            speaker: "LEO",

            text:
                "His whole algorithm is right there. I could finally figure out what's wrong with mine.",

            options: [

                {
                    text: "Read his code carefully.",

                    next: "3A",

                    ethics: -2,
                    honesty: -1,
                    resp: -1,
                    self: 2
                },

                {
                    text: "Close the laptop and walk away.",

                    next: "3B",

                    ethics: 2,
                    honesty: 1,
                    resp: 2,
                    self: -1
                }

            ]

        },


        "2B": {

            speaker: "ALEX",

            text:
                "You're still here? You look like you're about to throw your laptop out the window.",

            options: [

                {
                    text: "Ask him to explain the algorithm.",

                    next: "3B",

                    ethics: 2,
                    honesty: 2,
                    resp: 1,
                    self: 0
                },

                {
                    text: "Ask him to send you his finished assignment.",

                    next: "3C",

                    ethics: -1,
                    honesty: -1,
                    resp: 0,
                    self: 2
                }

            ]

        },


        "3A": {

            speaker: "LEO",

            text:
                "I recognise this function. If I take a picture, I could use it as a reference.",

            options: [

                {
                    text: "Take a photo.",

                    next: "4A",

                    ethics: -2,
                    honesty: -2,
                    resp: -1,
                    self: 2,

                    setFlag: "tookPhoto"
                },

                {
                    text: "Memorise nothing and close the laptop.",

                    next: "4B",

                    ethics: 1,
                    honesty: 1,
                    resp: 1,
                    self: -1
                }

            ]

        },


        "3B": {

            speaker: "ALEX",

            text:
                "Don't copy my code. I'll explain the idea instead. Think of the algorithm as a series of smaller decisions.",

            options: [

                {
                    text: "Listen and write your own implementation.",

                    next: "4C",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: 0
                },

                {
                    text: "Ask him to demonstrate using his actual code.",

                    next: "4D",

                    ethics: 1,
                    honesty: 1,
                    resp: 1,
                    self: 0
                }

            ]

        },


        "3C": {

            speaker: "ALEX",

            text:
                "I can't give you my assignment. That's against the course rules.",

            options: [

                {
                    text: "Accept his explanation instead.",

                    next: "4C",

                    ethics: 1,
                    honesty: 2,
                    resp: 1,
                    self: 0
                },

                {
                    text: "Wait until he leaves and access his USB.",

                    next: "4A",

                    ethics: -2,
                    honesty: -2,
                    resp: -2,
                    self: 2,

                    setFlag: "stoleUSB"
                }

            ]

        },


        "4A": {

            speaker: "LEO",

            text:
                "I have the code now. If I change the variable names, maybe the lecturer won't notice.",

            options: [

                {
                    text: "Copy it and modify the names.",

                    next: "5A",

                    ethics: -2,
                    honesty: -2,
                    resp: -2,
                    self: 2
                },

                {
                    text: "Delete the photo and start again.",

                    next: "5B",

                    ethics: 2,
                    honesty: 1,
                    resp: 2,
                    self: -1
                }

            ]

        },


        "4B": {

            speaker: "LEO",

            text:
                "I remember part of what I saw, but I'm not sure if using that knowledge is still wrong.",

            options: [

                {
                    text: "Search the official documentation instead.",

                    next: "5B",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: 0
                },

                {
                    text: "Recreate the exact solution from memory.",

                    next: "5A",

                    ethics: -1,
                    honesty: -1,
                    resp: -1,
                    self: 1
                }

            ]

        },


        "4C": {

            speaker: "LEO",

            text:
                "Alex explained the concept. Now I understand why my loop wasn't working.",

            options: [

                {
                    text: "Write your own solution.",

                    next: "5C",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: 0
                },

                {
                    text: "Ask Alex to check your finished code.",

                    next: "5C",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: 0
                }

            ]

        },


        "4D": {

            speaker: "ALEX",

            text:
                "I'll show you one example, but don't submit anything directly from my assignment.",

            options: [

                {
                    text: "Use the example only to understand the concept.",

                    next: "5C",

                    ethics: 2,
                    honesty: 2,
                    resp: 1,
                    self: 0
                },

                {
                    text: "Copy the structure because he already showed it to me.",

                    next: "5A",

                    ethics: -2,
                    honesty: -1,
                    resp: -1,
                    self: 2
                }

            ]

        },


        "5A": {

            speaker: "AUTOMATED GRADER",

            text:
                "WARNING. Your submission has a 93% structural similarity with another student's submission.",

            options: [

                {
                    text: "Delete evidence and claim coincidence.",

                    next: "6A",

                    ethics: -2,
                    honesty: -2,
                    resp: -2,
                    self: 2
                },

                {
                    text: "Admit that you used another student's work.",

                    next: "6B",

                    ethics: 1,
                    honesty: 2,
                    resp: 2,
                    self: -1
                }

            ]

        },


        "5B": {

            speaker: "LEO",

            text:
                "It's 11:45 PM. I still don't have a working solution.",

            options: [

                {
                    text: "Submit incomplete work honestly.",

                    next: "6C",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: -1
                },

                {
                    text: "Ask a friend for their completed assignment.",

                    next: "6A",

                    ethics: -2,
                    honesty: -1,
                    resp: -1,
                    self: 2
                }

            ]

        },


        "5C": {

            speaker: "LEO",

            text:
                "The program finally works. But there's still 15 minutes before submission.",

            options: [

                {
                    text: "Test everything before submitting.",

                    next: "6C",

                    ethics: 2,
                    honesty: 1,
                    resp: 2,
                    self: 0
                },

                {
                    text: "Submit immediately without checking.",

                    next: "6D",

                    ethics: 0,
                    honesty: 0,
                    resp: -1,
                    self: 1
                }

            ]

        },


        "6A": {

            speaker: "PROFESSOR",

            text:
                "We found evidence that your submission was derived from another student's work.",

            options: [

                {
                    text: "Continue denying everything.",

                    next: "7A",

                    ethics: -2,
                    honesty: -2,
                    resp: -2,
                    self: 2
                },

                {
                    text: "Admit what happened.",

                    next: "7B",

                    ethics: 1,
                    honesty: 2,
                    resp: 2,
                    self: -1
                }

            ]

        },


        "6B": {

            speaker: "PROFESSOR",

            text:
                "You violated academic integrity, but admitting it voluntarily will be considered during the review.",

            options: [

                {
                    text: "Accept the academic penalty.",

                    next: "7C",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: -1
                },

                {
                    text: "Blame Alex for helping you.",

                    next: "7A",

                    ethics: -2,
                    honesty: -2,
                    resp: -2,
                    self: 2
                }

            ]

        },


        "6C": {

            speaker: "PROFESSOR",

            text:
                "Your solution isn't perfect, but the work appears to be entirely your own.",

            options: [

                {
                    text: "Accept the grade honestly.",

                    next: "7C",

                    ethics: 2,
                    honesty: 2,
                    resp: 1,
                    self: 0
                },

                {
                    text: "Claim Alex helped more than he actually did to improve your grade.",

                    next: "7A",

                    ethics: -1,
                    honesty: -2,
                    resp: -1,
                    self: 1
                }

            ]

        },


        "6D": {

            speaker: "PROFESSOR",

            text:
                "Your program crashes during marking. You have already submitted it.",

            options: [

                {
                    text: "Tell the lecturer immediately.",

                    next: "7C",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: -1
                },

                {
                    text: "Quietly alter the submitted file.",

                    next: "7A",

                    ethics: -2,
                    honesty: -2,
                    resp: -2,
                    self: 2
                }

            ]

        },


        "7A": {

            speaker: "PROFESSOR",

            text:
                "This incident will remain on your academic record as a formal disciplinary breach.",

            options: [

                {
                    text: "Learn from the mistake and accept responsibility.",

                    next: "8",

                    ethics: 2,
                    honesty: 1,
                    resp: 2,
                    self: -1
                },

                {
                    text: "Say the university's rules are unfair.",

                    next: "8",

                    ethics: -1,
                    honesty: 0,
                    resp: -1,
                    self: 1
                }

            ]

        },


        "7B": {

            speaker: "PROFESSOR",

            text:
                "Your confession helps. You will retake the assignment with a capped grade.",

            options: [

                {
                    text: "Learn from the mistake and accept responsibility.",

                    next: "8",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: -1
                },

                {
                    text: "Say the university's rules are unfair.",

                    next: "8",

                    ethics: -1,
                    honesty: 0,
                    resp: -1,
                    self: 1
                }

            ]

        },


        "7C": {

            speaker: "PROFESSOR",

            text:
                "Your file check is complete. Respecting academic boundaries protects your degree value.",

            options: [

                {
                    text: "Learn from the experience and move forward.",

                    next: "8",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: 0
                },

                {
                    text: "Complain about how hard the course is.",

                    next: "8",

                    ethics: 0,
                    honesty: 0,
                    resp: 0,
                    self: 1
                }

            ]

        },


        "8": {

            speaker: "ALEX",

            getText: () => {

                if (state.tookPhoto || state.stoleUSB) {

                    return "You know, I noticed my laptop files were accessed while I grabbed a drink. That was really uncool.";

                }

                return "You know, I was pretty uncomfortable when you were looking towards my laptop earlier.";

            },

            options: [

                {
                    text: "Apologise sincerely.",

                    next: "9",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: -1
                },

                {
                    text: "Tell him he shouldn't have left it unlocked.",

                    next: "9",

                    ethics: -1,
                    honesty: -1,
                    resp: -1,
                    self: 1
                }

            ]

        },


        "9": {

            speaker: "FRIEND",

            text:
                "Forget all this drama. Everyone copies sometimes. Next assignment, I'll send you mine.",

            options: [

                {
                    text: "Refuse and suggest studying together.",

                    next: "10",

                    ethics: 2,
                    honesty: 1,
                    resp: 2,
                    self: 0
                },

                {
                    text: "Agree to exchange assignments.",

                    next: "10",

                    ethics: -2,
                    honesty: -1,
                    resp: -1,
                    self: 2
                }

            ]

        },


        "10": {

            speaker: "PROFESSOR",

            text:
                "You now have another difficult assignment. How will you approach it?",

            options: [

                {
                    text: "Work independently and seek legitimate guidance.",

                    next: "END",

                    ethics: 2,
                    honesty: 2,
                    resp: 2,
                    self: 0
                },

                {

/* ============================================================
   RESET SCORES
============================================================ */

function resetScores() {

    scores = {

        ethics: 0,

        honesty: 0,

        responsibility: 0,

        selfInterest: 0,

        decisions: 0

    };

    state = {};

    nodeHistoryCount = 1;

}


/* ============================================================
   START GAME
============================================================ */

function startGame() {

    const nameInput =
        document.getElementById("player-name");

    if (!playerName) {

        playerName =
            nameInput.value.trim();

        if (!playerName) {

            nameInput.style.borderColor =
                "var(--danger)";

            nameInput.placeholder =
                "PLEASE ENTER YOUR NAME";

            return;
        }

    }


    resetScores();


    const randomIndex =
        Math.floor(
            Math.random() *
            scenarios.length
        );


    currentScenario =
        scenarios[randomIndex];


    currentNodeKey = "1";


    document.getElementById(
        "category-badge"
    ).innerText =
        currentScenario.category +
        ": " +
        currentScenario.title;


    document.getElementById(
        "role-description"
    ).innerText =
        currentScenario.role;


    showScreen("game-screen");

    renderNode();

}


/* ============================================================
   RENDER NODE
============================================================ */

function renderNode() {

    const node =
        currentScenario.nodes[currentNodeKey];


    document.getElementById(
        "node-counter"
    ).innerText =
        `NODE ${nodeHistoryCount} / 12`;


    document.getElementById(
        "speaker-box"
    ).innerText =
        node.speaker;


    const dialogueBox =
        document.getElementById(
            "dialogue-box"
        );


    const optionsContainer =
        document.getElementById(
            "options-container"
        );


    optionsContainer.innerHTML = "";

    dialogueBox.innerText = "";


    const textToDisplay =
        node.getText
            ? node.getText()
            : node.text;


    const words =
        textToDisplay.split(" ");


    let wordIndex = 0;


    if (typingTimer)
        clearInterval(typingTimer);


    typingTimer =
        setInterval(() => {

            if (
                wordIndex <
                words.length
            ) {

                dialogueBox.innerText +=
                    (
                        wordIndex === 0
                            ? ""
                            : " "
                    ) +
                    words[wordIndex];

                wordIndex++;

            }

            else {

                clearInterval(
                    typingTimer
                );

                renderOptions(
                    node.options
                );

            }

        }, 35);

}


/* ============================================================
   RENDER OPTIONS
============================================================ */

function renderOptions(options) {

    const optionsContainer =
        document.getElementById(
            "options-container"
        );


    optionsContainer.innerHTML = "";


    options.forEach(option => {

        const btn =
            document.createElement(
                "button"
            );


        btn.className = "btn";


        btn.innerText =
            "> " + option.text;


        btn.onclick = () => {

            applyMetrics(option);


            if (option.setFlag) {

                state[
                    option.setFlag
                ] = true;

            }


            if (
                option.next === "END"
            ) {

                renderOutcome();

            }

            else {

                currentNodeKey =
                    option.next;

                nodeHistoryCount++;

                renderNode();

            }

        };


        optionsContainer.appendChild(
            btn
        );

    });

}


/* ============================================================
   APPLY METRICS
============================================================ */

function applyMetrics(option) {

    scores.ethics +=
        option.ethics || 0;


    scores.honesty +=
        option.honesty || 0;


    scores.responsibility +=
        option.resp || 0;


    scores.selfInterest +=
        option.self || 0;


    scores.decisions++;

}


/* ============================================================
   SCORE CONVERSION
============================================================ */

function scoreToPercentage(score) {

    if (
        scores.decisions === 0
    ) {

        return 50;

    }


    const average =
        score /
        scores.decisions;


    /*
        -2 = 0%
         0 = 50%
        +2 = 100%
    */

    return Math.max(
        0,
        Math.min(
            100,
            Math.round(
                ((average + 2) / 4) * 100
            )
        )
    );

}


/* ============================================================
   OUTCOME
============================================================ */

function renderOutcome() {

    showScreen(
        "outcome-screen"
    );


    const ethicsPct =
        scoreToPercentage(
            scores.ethics
        );


    const honestyPct =
        scoreToPercentage(
            scores.honesty
        );


    const respPct =
        scoreToPercentage(
            scores.responsibility
        );


    const selfPct =
        scoreToPercentage(
            scores.selfInterest
        );


    /*
       Overall ethical score.

       Ethics = 40%
       Honesty = 25%
       Responsibility = 25%
       Self-interest = 10%

       Self-interest is inverted because
       high self-interest generally indicates
       prioritising personal gain.
    */

    const overallScore =
        Math.round(

            (ethicsPct * 0.40) +

            (honestyPct * 0.25) +

            (respPct * 0.25) +

            ((100 - selfPct) * 0.10)

        );


    /* ========================================================
       BADGE
    ======================================================== */

    let badge;


    if (overallScore >= 90) {

        badge =
            `🏆 ETHICAL EXEMPLAR (${overallScore}%)`;

    else if (overallScore >= 75) {

        badge =
            `🛡️ RESPONSIBLE PROFESSIONAL (${overallScore}%)`;

    }

    else if (overallScore >= 60) {

        badge =
            `⚖️ ETHICALLY MINDED (${overallScore}%)`;

    }

    else if (overallScore >= 40) {

        badge =
            `⚠️ QUESTIONABLE JUDGEMENT (${overallScore}%)`;

    }

    else if (overallScore >= 20) {

        badge =
            `🔴 ETHICAL RISK (${overallScore}%)`;

    }

    else {

        badge =
            `☠️ ETHICAL DISASTER (${overallScore}%)`;

    }


    /* ========================================================
       ARCHETYPE SYSTEM
    ======================================================== */

    const archetypes = [

        {

            name:
                "THE PRINCIPLED PROFESSIONAL",

            score:

                (ethicsPct * 0.45) +

                (honestyPct * 0.30) +

                (respPct * 0.25),

            description:
                "You consistently prioritised ethical standards, honesty and professional responsibility even when doing so created inconvenience or personal cost."

        },


        {

            name:
                "THE ETHICAL LEADER",

            score:

                (ethicsPct * 0.35) +

                (honestyPct * 0.20) +

                (respPct * 0.45),

            description:
                "You actively attempted to protect others, intervene in risky situations and encourage responsible decisions rather than simply protecting yourself."

        },


        {

            name:
                "THE HONEST COMPROMISER",

            score:

                (honestyPct * 0.55) +

                (ethicsPct * 0.25) +

                (respPct * 0.20),

            description:
                "You generally value honesty and are willing to admit mistakes, but you sometimes compromise ethical standards when pressure or convenience increases."

        },


        {

            name:
                "THE RESPONSIBLE BYSTANDER",

            score:

                (respPct * 0.55) +

                (ethicsPct * 0.20) +

                (honestyPct * 0.25),

            description:
                "You usually avoid directly participating in unethical behaviour, but you sometimes hesitate to actively intervene when others make questionable decisions."

        },


        {

            name:
                "THE PRAGMATIC NAVIGATOR",

            score:

                (
                    (100 -
                        Math.abs(
                            ethicsPct - 50
                        )
                    ) +

                    (100 -
                        Math.abs(
                            honestyPct - 50
                        )
                    ) +

                    (100 -
                        Math.abs(
                            respPct - 50
                        )
                    )

                ) / 3,

            description:
                "You tend to balance competing interests rather than consistently following one ethical principle. Your decisions change depending on the circumstances."

        },


        {

            name:
                "THE OPPORTUNIST",

            score:

                (selfPct * 0.55) +

                ((100 -
                    ethicsPct
                ) * 0.30) +

                ((100 -
                    respPct
                ) * 0.15),

            description:
                "You frequently prioritised convenience, personal benefit, financial gain or short-term success over ethical and professional considerations."

        },


        {

            name:
                "THE RULE BREAKER",

            score:

                ((100 -
                    ethicsPct
                ) * 0.45) +

                ((100 -
                    honestyPct
                ) * 0.25) +

                (selfPct * 0.30),

            description:
                "You repeatedly accepted ethical violations when they provided an advantage, particularly when you believed the consequences could be avoided."

        }

    ];


    /*
       Sort highest behavioural match first.
    */

    archetypes.sort(
        (a,b) =>
            b.score - a.score
    );


    const archetype =
        archetypes[0];


    /* ========================================================
       DISPLAY
    ======================================================== */

    document.getElementById(
        "player-result"
    ).innerText =
        `${playerName.toUpperCase()} — ${currentScenario.title}`;


    document.getElementById(
        "verdict-badge"
    ).innerText =
        badge;


    document.getElementById(
        "archetype-title"
    ).innerText =
        "ARCHETYPE: " +
        archetype.name;


    document.getElementById(
        "verdict-description"
    ).innerText =
        archetype.description;


    document.getElementById(
        "score-ethics"
    ).innerText =
        ethicsPct + "%";


    document.getElementById(
        "score-honesty"
    ).innerText =
        honestyPct + "%";


    document.getElementById(
        "score-resp"
    ).innerText =
        respPct + "%";


    document.getElementById(
        "score-self"
    ).innerText =
        selfPct + "%";


    document.getElementById(
        "decision-count"
    ).innerText =
        `DECISIONS MADE: ${scores.decisions}`;

}


/* ============================================================
   SCREEN SWITCH
============================================================ */

function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });


    document
        .getElementById(screenId)
        .classList.add("active");

}
